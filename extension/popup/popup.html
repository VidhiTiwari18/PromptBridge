<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 340px;
      font-family: -apple-system, Segoe UI, sans-serif;
      padding: 16px;
      background: #faf9f7;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px 0;
      color: #1a1a1a;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #d97757;
      color: white;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button.secondary {
      background: #eee;
      color: #333;
    }
    button:hover { opacity: 0.9; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
      min-height: 16px;
    }
    .hidden { display: none; }
    #loggedInEmail {
      font-size: 12px;
      color: #999;
      margin-bottom: 10px;
    }
    #summaryBox {
      font-size: 12px;
      background: white;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>PromptBridge</h1>

  <div id="loginView">
    <input type="email" id="emailInput" placeholder="Email">
    <input type="password" id="passwordInput" placeholder="Password">
    <button id="loginBtn">Log in</button>
    <button id="registerBtn">Register instead</button>
  </div>

  <div id="mainView" class="hidden">
    <div id="loggedInEmail"></div>
    <button id="captureBtn">Capture this conversation</button>
    <button id="summarizeBtn" class="secondary hidden">Summarize it</button>
    <div id="summaryBox" class="hidden"></div>
    <button id="logoutBtn" class="secondary">Log out</button>
  </div>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
